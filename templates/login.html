<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilheiro.bet</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="apple-mobile-web-app-title" content="Planilheiro.bet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0e1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" method="post">
      <div class="app-wordmark login-wordmark">
        <svg class="app-wordmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15h4l3-5 3 7 3-4h5"/></svg>
        <span class="app-wordmark-text">PLANILHEIRO<span class="app-wordmark-dot">.BET</span></span>
      </div>
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autofocus required autocomplete="username">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    // Sem botão de alternar aqui — a escolha de tema é só lá em Configurações,
    // no dashboard. Essa tela só aplica o que já estiver salvo, pra não
    // "piscar" claro antes do dashboard carregar. Sem nada salvo ainda, o
    // padrão é o Nebulosa.
    function applyTheme(themeId) {
      const isDark = themeId.startsWith("dark");
      document.body.dataset.theme = themeId;
      document.body.classList.toggle("theme-dark", isDark);
      try { localStorage.setItem("painel_theme", themeId); } catch (e) {}
    }

    try {
      const salvo = localStorage.getItem("painel_theme");
      if (salvo) {
        applyTheme(salvo);
      } else if (localStorage.getItem("painel_dark_mode") === "1") {
        applyTheme("dark-default");
      } else {
        applyTheme("dark-nebulosa");
      }
    } catch (e) {
      applyTheme("dark-nebulosa");
    }

    const FONT_STACKS = {
      "montserrat": `"Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "inter": `"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "work-sans": `"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "ibm-plex-sans": `"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "source-sans-3": `"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "dm-sans": `"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "manrope": `"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "outfit": `"Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "sora": `"Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
      "space-grotesk": `"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
    };
    try {
      const fonteSalva = localStorage.getItem("painel_font");
      if (fonteSalva && FONT_STACKS[fonteSalva]) {
        document.documentElement.style.setProperty("--font-family", FONT_STACKS[fonteSalva]);
      }
    } catch (e) {}
  </script>
</body>
</html>
