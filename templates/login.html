<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Painel de Apostas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <div class="login-brand">
      <span class="brand-mark">B</span>
      <div>
        <div class="brand-name">Painel de Apostas</div>
        <div class="brand-sub">Acesso restrito</div>
      </div>
    </div>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autofocus required>
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
