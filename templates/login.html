<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luís Vaccari - Gestão de Banca</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-topbar">
      <button class="dark-toggle-btn" id="toggle-dark-login" title="Modo noturno"></button>
    </div>
    <form class="login-card" method="post">
      <div class="login-brand">
        <span class="brand-mark">LV</span>
        <div>
          <div class="brand-name">Luís Vaccari</div>
          <div class="brand-sub">Gestão de banca</div>
        </div>
      </div>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autofocus required>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
    const btn = document.getElementById("toggle-dark-login");

    function setDarkMode(on) {
      document.body.classList.toggle("dark-mode", on);
      btn.innerHTML = on ? ICON_SUN : ICON_MOON;
      try { localStorage.setItem("painel_dark_mode", on ? "1" : "0"); } catch (e) {}
    }

    btn.addEventListener("click", () => {
      setDarkMode(!document.body.classList.contains("dark-mode"));
    });

    btn.innerHTML = ICON_MOON;
    try {
      setDarkMode(localStorage.getItem("painel_dark_mode") === "1");
    } catch (e) {}
  </script>
</body>
</html>
